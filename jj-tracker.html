<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JJ Birdies — Tracker</title>
<meta name="description" content="Fly, Birdie. Jiwan &amp; Jiseok's birdie donation tracker.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DCE8ED; --bg-2:#CFE0E7; --card:#FFFFFF;
  --navy:#0F1F2C; --ink:#0F1F2C; --ink-soft:#3d5666;
  --teal:#1F6673; --teal-soft:#CBE3E8;
  --gold:#B9822A; --gold-bg:#F5D89A; --gold-text:#5c4110;
  --line:rgba(15,31,44,.16);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Noto Sans KR','Noto Sans SC',sans-serif; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Noto Serif KR',serif;}
.mono{font-family:'Space Mono',monospace;}
.wrap{max-width:460px;margin:0 auto;padding:20px 18px 60px;}

.langbar{display:flex;justify-content:center;gap:6px;margin-bottom:18px;}
.langbtn{
  font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;
  background:#fff;border:1px solid var(--line);color:var(--ink-soft);
  padding:6px 12px;border-radius:99px;cursor:pointer;
}
.langbtn.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700;}

.head{text-align:center;margin-bottom:10px;}
.head .mark{
  font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:6px;
}
.head h1{font-size:22px;font-weight:900;color:var(--ink);}

.pot{text-align:center;padding:22px 0 10px;}
.pot .lbl{font-size:12px;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:4px;}
.pot .num{font-family:'Space Mono',monospace;font-size:56px;font-weight:700;color:var(--navy);line-height:1;}
.pot .sub{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}

.lifetime{
  background:var(--card);border-radius:14px;padding:16px 20px;text-align:center;margin:18px 0 30px;
  box-shadow:0 1px 3px rgba(27,42,56,.06);
}
.lifetime .lbl{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
.lifetime .num{font-family:'Space Mono',monospace;font-size:32px;font-weight:700;color:var(--navy);}

.sect-t{
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);
  margin:0 2px 12px;font-weight:700;
}

.round{
  display:flex;gap:12px;align-items:center;background:var(--card);border-radius:12px;
  padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(27,42,56,.06);
}
.round .thumb{
  width:48px;height:48px;border-radius:8px;background:var(--teal-soft);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--teal);overflow:hidden;
}
.round .thumb img{width:100%;height:100%;object-fit:cover;}
.round .info{flex:1;min-width:0;}
.round .date{font-size:11.5px;color:var(--ink-soft);}
.round .tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:99px;}
.tag.birdie{background:var(--teal-soft);color:var(--teal);}
.tag.win{background:var(--gold-bg);color:var(--gold-text);display:inline-flex;align-items:center;gap:3px;}
.round .amt{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:var(--navy);white-space:nowrap;}

.gift{
  background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(27,42,56,.06);
}
.gift .media{
  width:100%;aspect-ratio:16/9;background:var(--teal-soft);
  display:flex;align-items:center;justify-content:center;color:var(--teal);font-size:13px;
  text-align:center;padding:16px;
}
.gift .media img,.gift .media video{width:100%;height:100%;object-fit:cover;}
.gift .body{padding:14px 16px;}
.gift .date{font-size:11.5px;color:var(--ink-soft);}
.gift .org{font-size:15px;font-weight:700;color:var(--ink);margin:4px 0 6px;}
.gift .caption{font-size:13px;line-height:1.6;color:var(--ink-soft);margin-bottom:8px;}
.gift .amt{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--navy);}

.empty{
  text-align:center;padding:22px;color:var(--ink-soft);font-size:13px;
  background:var(--card);border-radius:12px;border:1px dashed var(--line);
}

.cta{
  display:block;width:100%;margin-top:10px;padding:16px;background:var(--navy);color:#fff;
  text-align:center;border-radius:12px;font-weight:700;font-size:14.5px;text-decoration:none;
}

footer{text-align:center;margin-top:36px;}
footer .tags2{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">

  <div class="langbar">
    <button class="langbtn" data-lang="ko" onclick="setLang('ko')">한국어</button>
    <button class="langbtn" data-lang="en" onclick="setLang('en')">EN</button>
    <button class="langbtn" data-lang="zh" onclick="setLang('zh')">中文</button>
  </div>

  <div class="head">
    <div class="mark">JJ Birdies</div>
    <h1>Fly, Birdie.</h1>
  </div>

  <div class="pot">
    <div class="lbl" id="potLabel">현재 적립함</div>
    <div class="num mono" id="potNum">$0</div>
    <div class="sub" id="potSub">아직 적립된 라운드가 없어요</div>
  </div>

  <div class="lifetime">
    <div class="lbl" id="lifetimeLabel">누적 기부액</div>
    <div class="num" id="lifetimeNum">$0</div>
  </div>

  <div class="sect-t" id="sectRounds">최근 라운드</div>
  <div id="roundsList"></div>

  <div class="sect-t" id="sectGifts" style="margin-top:28px;">기부 기록</div>
  <div id="giftsList"></div>

  <a href="jj-project.html" class="cta" id="ctaLink">프로젝트 소개 전체 보기 →</a>

  <footer>
    <div class="tags2">#JJBirdies #FlyBirdie</div>
  </footer>

</div>

<script>
var DB = 'https://jj-project-19847-default-rtdb.firebaseio.com';

var LANG = {
  ko: {
    potLabel: '현재 적립함', lifetimeLabel: '누적 기부액',
    sectRounds: '최근 라운드', sectGifts: '기부 기록', ctaLink: '프로젝트 소개 전체 보기 →',
    emptyRounds: '첫 라운드 기록을 기다리고 있어요',
    emptyGifts: '아직 전달된 기부가 없어요<br>적립함이 채워지면 여기에 기록될 거예요',
    emptyData: '데이터를 불러오지 못했어요',
    potSubEmpty: '다음 라운드를 기다리는 중',
    potSubActive: function(n){ return '라운드 ' + n + '건 · 다음 기부를 기다리는 중'; },
    birdie: '버디', eagle: '이글+', win: '1위', delivered: '전달',
    mediaPending: '전달 사진·영상 준비 중'
  },
  en: {
    potLabel: 'Current pot', lifetimeLabel: 'Lifetime donated',
    sectRounds: 'Recent rounds', sectGifts: 'Donation history', ctaLink: 'See the full project →',
    emptyRounds: 'Waiting for the first round',
    emptyGifts: 'No donations yet<br>They will show up here once the pot is given away',
    emptyData: 'Could not load data',
    potSubEmpty: 'Waiting for the next round',
    potSubActive: function(n){ return n + ' round' + (n>1?'s':'') + ' logged \u00b7 saving up for the next gift'; },
    birdie: 'Birdie', eagle: 'Eagle+', win: '1st place', delivered: 'donated',
    mediaPending: 'Photo / video coming soon'
  },
  zh: {
    potLabel: '当前累积', lifetimeLabel: '累计捐赠',
    sectRounds: '最近回合', sectGifts: '捐赠记录', ctaLink: '查看项目完整介绍 →',
    emptyRounds: '正在等待第一轮记录',
    emptyGifts: '还没有捐赠记录<br>累积金额捐出后会显示在这里',
    emptyData: '数据加载失败',
    potSubEmpty: '正在等待下一轮',
    potSubActive: function(n){ return '已记录 ' + n + ' 轮 \u00b7 正在为下一次捐赠积累'; },
    birdie: '小鸟球', eagle: '老鹰球+', win: '第一名', delivered: '已捐赠',
    mediaPending: '照片/视频即将上传'
  }
};

var currentLang = localStorage.getItem('jj_lang') || 'en';
var lastROUNDS = [];
var lastGIFTS = [];

function fmt(n){ return '$' + Math.round(n).toLocaleString('en-US'); }
function toArray(obj){ if (!obj) return []; return Object.keys(obj).map(function(k){ return obj[k]; }); }

function setLang(lang){
  currentLang = lang;
  localStorage.setItem('jj_lang', lang);
  document.querySelectorAll('.langbtn').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  document.documentElement.lang = lang;
  applyStaticText();
  render(lastROUNDS, lastGIFTS);
}

function applyStaticText(){
  var t = LANG[currentLang];
  document.getElementById('potLabel').textContent = t.potLabel;
  document.getElementById('lifetimeLabel').textContent = t.lifetimeLabel;
  document.getElementById('sectRounds').textContent = t.sectRounds;
  document.getElementById('sectGifts').textContent = t.sectGifts;
  document.getElementById('ctaLink').textContent = t.ctaLink;
}

async function loadData(){
  try{
    var r1 = await fetch(DB + '/rounds.json').then(function(r){ return r.json(); });
    var r2 = await fetch(DB + '/gifts.json').then(function(r){ return r.json(); });
    lastROUNDS = toArray(r1).sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    lastGIFTS = toArray(r2).sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    render(lastROUNDS, lastGIFTS);
  }catch(e){
    console.error(e);
    document.getElementById('roundsList').innerHTML = '<div class="empty">' + LANG[currentLang].emptyData + '</div>';
  }
}

function render(ROUNDS, GIFTS){
  var t = LANG[currentLang];
  var lastGiftDate = GIFTS.length ? GIFTS[GIFTS.length-1].date : null;
  var currentRounds = ROUNDS.filter(function(r){ return !lastGiftDate || r.date > lastGiftDate; });
  var potTotal = currentRounds.reduce(function(s,r){ return s + r.amount; }, 0);
  var lifetimeTotal = GIFTS.reduce(function(s,g){ return s + g.amount; }, 0);

  document.getElementById('potNum').textContent = fmt(potTotal);
  document.getElementById('lifetimeNum').textContent = fmt(lifetimeTotal);
  document.getElementById('potSub').textContent = currentRounds.length
    ? t.potSubActive(currentRounds.length)
    : t.potSubEmpty;

  var roundsList = document.getElementById('roundsList');
  roundsList.innerHTML = '';
  if (ROUNDS.length === 0) {
    roundsList.innerHTML = '<div class="empty">' + t.emptyRounds + '</div>';
  } else {
    ROUNDS.slice().reverse().forEach(function(r){
      var div = document.createElement('div');
      div.className = 'round';
      var thumb = r.photo ? '<img src="'+r.photo+'" alt="">' : '<i class="ti"></i>⛳';
      var tags = '';
      if (r.birdies) tags += '<span class="tag birdie">'+t.birdie+' '+r.birdies+'</span>';
      if (r.eagles) tags += '<span class="tag birdie">'+t.eagle+' '+r.eagles+'</span>';
      if (r.win) tags += '<span class="tag win">🏅 '+t.win+'</span>';
      div.innerHTML =
        '<div class="thumb">'+thumb+'</div>'+
        '<div class="info">'+
          '<div class="date">'+r.date+(r.course ? ' · '+r.course : '')+'</div>'+
          '<div class="tags">'+tags+'</div>'+
        '</div>'+
        '<div class="amt">+'+fmt(r.amount)+'</div>';
      roundsList.appendChild(div);
    });
  }

  var giftsList = document.getElementById('giftsList');
  giftsList.innerHTML = '';
  if (GIFTS.length === 0) {
    giftsList.innerHTML = '<div class="empty">' + t.emptyGifts + '</div>';
  } else {
    GIFTS.slice().reverse().forEach(function(g){
      var card = document.createElement('div');
      card.className = 'gift';
      var mediaHtml = t.mediaPending;
      if (g.media) {
        mediaHtml = /\.(mp4|webm|mov)$/i.test(g.media)
          ? '<video src="'+g.media+'" controls></video>'
          : '<img src="'+g.media+'" alt="">';
      }
      card.innerHTML =
        '<div class="media">'+mediaHtml+'</div>'+
        '<div class="body">'+
          '<div class="date">'+g.date+'</div>'+
          '<div class="org">'+(g.org||'')+'</div>'+
          '<div class="caption">'+(g.caption||'')+'</div>'+
          '<div class="amt">'+fmt(g.amount)+' '+t.delivered+'</div>'+
        '</div>';
      giftsList.appendChild(card);
    });
  }
}

document.querySelectorAll('.langbtn').forEach(function(b){
  b.classList.toggle('on', b.getAttribute('data-lang') === currentLang);
});
applyStaticText();
loadData();
</script>
</body>
</html>
